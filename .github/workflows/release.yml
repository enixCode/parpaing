# Release: on a version tag, push the three images to GHCR for linux/amd64 and linux/arm64, and the SDK to npm.
# package.json, sdk/package.json and the images in compose.yml all carry the tag's version.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ghcr.io/enixcode/parpaing
            file: Dockerfile
          - image: ghcr.io/enixcode/parpaing-gateway
            file: gateway/Dockerfile
          - image: ghcr.io/enixcode/parpaing-egress
            file: egress/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches package.json and compose.yml
        run: |
          version=$(jq -r .version package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          # Once compose.yml pulls from ghcr.io, every image it pulls must be this version.
          while read -r ref; do
            if [ "${ref##*:}" != "$version" ]; then
              echo "::error::compose.yml pulls $ref, expected version $version"
              exit 1
            fi
          done < <(grep -o "ghcr.io/enixcode/[a-z-]*:[^\" ]*" compose.yml || true)

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          # latest is added by default for semver tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The SDK on npm through trusted publishing: the package parpaing on npmjs.com trusts this workflow, so there is no
  # token, and npm adds the provenance itself. Node 26 brings an npm recent enough for it (11.5.1 or later).
  sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches sdk/package.json
        run: |
          version=$(jq -r .version sdk/package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match sdk/package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      # TypeScript comes from the root; npm publish builds dist/ first (prepack).
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: npm publish
        working-directory: sdk
