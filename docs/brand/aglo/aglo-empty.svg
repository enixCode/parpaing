<svg xmlns="http://www.w3.org/2000/svg" width="376" height="196" viewBox="18 36 188 98" role="img" aria-label="Aglo floats gently and looks at the dotted outline of the next block, then at you: nothing here yet"><style>.aglo-empty-lift { animation: aglo-empty-lift 2s ease-in-out infinite alternate; } .aglo-empty-sway { transform-origin: 102px 68px; animation: aglo-empty-sway 3s ease-in-out infinite alternate; } @keyframes aglo-empty-lift { from { transform: translateY(0); } to { transform: translateY(-4px); } } @keyframes aglo-empty-sway { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } } .aglo-empty-gaze { transform: translate(4px, 4px); animation: aglo-empty-gaze 6s ease-in-out infinite; } .aglo-empty-eyes { transform-origin: 102px 68px; animation: aglo-empty-blink 5s ease-in-out infinite; } .aglo-empty-slot { animation: aglo-empty-march 1.8s linear infinite; } @keyframes aglo-empty-gaze { 0%, 40%, 90%, 100% { transform: translate(4px, 4px); } 50%, 80% { transform: translate(0, 0); } } @keyframes aglo-empty-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.12); } } @keyframes aglo-empty-march { to { stroke-dashoffset: -9; } } @media (prefers-reduced-motion: reduce) { .aglo-empty-gaze, .aglo-empty-eyes, .aglo-empty-slot, .aglo-empty-lift, .aglo-empty-sway { animation: none !important; } }</style><path d="M22 129H202" stroke="#333a4a" stroke-width="1.5"/><rect class="aglo-empty-slot" x="114" y="92" width="60" height="36" rx="3" fill="none" stroke="#9aa1b2" stroke-width="1.5" stroke-dasharray="5 4"/><g><g><rect x="48" y="92" width="60" height="36" rx="3" fill="#6e7891"/><rect x="60" y="104" width="12" height="12" fill="#121419"/><rect x="84" y="104" width="12" height="12" fill="#121419"/></g><g class="aglo-empty-lift"><g class="aglo-empty-sway"><rect x="72" y="50" width="60" height="36" rx="3" fill="#5cc2ff"/><g class="aglo-empty-gaze"><g class="aglo-empty-eyes"><circle cx="90" cy="68" r="6.45" fill="#121419"/><circle cx="114" cy="68" r="6.45" fill="#121419"/></g></g></g></g></g></svg>
