<svg xmlns="http://www.w3.org/2000/svg" width="304" height="196" viewBox="18 36 152 98" role="img" aria-label="Aglo, error: the top block slides off the joint and lands on its edge, eyes turned to crosses, then keeps trying to stand up and only rocks back and forth"><style>.aglo-error-top { transform-origin: 72px 50px; transform: translate(64.37px, 11.40px) rotate(75.00deg); animation: aglo-error-fall 3.4s linear 1 forwards; }
.aglo-error-eyes { transform-origin: 102px 68px; animation: aglo-error-gasp 3.4s step-end 1 forwards; }
.aglo-error-eo { opacity: 0; animation: aglo-error-eo-hit 3.4s step-end 1 forwards; }
.aglo-error-ea { opacity: 1; animation: aglo-error-ea-hit 3.4s step-end 1 forwards; }
.aglo-error-dl { opacity: 0.85; transform: translate(-6px, -2px); animation: aglo-error-puff-l 3.4s ease-out 1 forwards; }
.aglo-error-dr { opacity: 0.85; transform: translate(6px, -2px); animation: aglo-error-puff-r 3.4s ease-out 1 forwards; }
@keyframes aglo-error-fall {
