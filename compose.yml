# Use PARPAING_ADDRESS=0.0.0.0 to host on your public host ip
# Both images come from ghcr.io. After changing the code, docker compose up -d --build builds them from this folder.
services:
  parpaing:
    image: ghcr.io/enixcode/parpaing:0.2.0
    build: .
    container_name: parpaing
    restart: unless-stopped
    # ports: 
    #   - "${PARPAING_ADDRESS:-127.0.0.1}:8090:8090"
    environment:
      # Optional: when set, every API call needs Authorization: Bearer <key>.
      - PARPAING_API_KEY
      # Optional: default ceilings per sandbox (memory and disk in MB): 1024, 1, 1024, 10240.
      - PARPAING_MEMORY
      - PARPAING_CPUS
      - PARPAING_PROCESSES
      - PARPAING_DISK
      # Optional: free memory kept for the machine, in MB (512): under it, no new sandbox.
      - PARPAING_RESERVED_MEMORY
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  # The gateway, the only port: nginx serves the web page and the brand kit, and relays everything else to the API.
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: ghcr.io/enixcode/parpaing-gateway:0.2.0
    container_name: parpaing-gateway
    restart: unless-stopped
    depends_on:
      - parpaing
    ports:
      - "${PARPAING_ADDRESS:-127.0.0.1}:8090:80"
