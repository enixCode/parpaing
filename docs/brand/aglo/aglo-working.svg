<svg xmlns="http://www.w3.org/2000/svg" width="288" height="196" viewBox="18 36 144 98" role="img" aria-label="Aglo at work: the two holes of the bottom block light up in turn"><style>.aglo-working-top { transform-origin: 102px 86px; animation: aglo-working-bob 2.8s ease-in-out infinite; }
.aglo-working-eyes { transform: translateY(3px); animation: aglo-working-glance 2.8s ease-in-out infinite; }
.aglo-working-e { animation: aglo-working-blink 2.8s linear infinite; }
.aglo-working-c1 { animation: aglo-working-lamp-a 2.8s ease-in-out infinite; }
.aglo-working-c2 { opacity: 0.1; animation: aglo-working-lamp-b 2.8s ease-in-out infinite; }
@keyframes aglo-working-blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(0.14); } }
@keyframes aglo-working-lamp-a { 0%, 8%, 92%, 100% { opacity: 1; } 42%, 58% { opacity: 0.1; } }
@keyframes aglo-working-lamp-b { 0%, 8%, 92%, 100% { opacity: 0.1; } 42%, 58% { opacity: 1; } }
@keyframes aglo-working-glance { 0%, 30%, 100% { transform: translateY(3px); } 55%, 80% { transform: translateY(0); } }
@keyframes aglo-working-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
@media (prefers-reduced-motion: reduce) { .aglo-working-e, .aglo-working-c1, .aglo-working-c2, .aglo-working-eyes, .aglo-working-top { animation: none !important; } }</style><path d="M22 129H158" stroke="#333a4a" stroke-width="1.5"/><g><g><rect x="48" y="92" width="60" height="36" rx="3" fill="#6e7891"/><rect x="60" y="104" width="12" height="12" fill="#121419"/><rect x="84" y="104" width="12" height="12" fill="#121419"/><rect class="aglo-working-c1" x="60" y="104" width="12" height="12" fill="#5cc2ff"/><rect class="aglo-working-c2" x="84" y="104" width="12" height="12" fill="#5cc2ff"/></g><g class="aglo-working-top"><rect x="72" y="50" width="60" height="36" rx="3" fill="#5cc2ff"/><g class="aglo-working-eyes"><circle class="aglo-working-e" style="transform-origin:90px 68px" cx="90" cy="68" r="6.45" fill="#121419"/><circle class="aglo-working-e" style="transform-origin:114px 68px" cx="114" cy="68" r="6.45" fill="#121419"/></g></g></g></svg>
