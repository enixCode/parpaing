# Use PARPAING_ADDRESS=0.0.0.0 to host on your public host ip: then PARPAING_API_KEY is required, and PARPAING_HOSTS lists the names it answers to.
# The images come from ghcr.io. After changing the code, docker compose up -d --build builds them from this folder.
services:
  parpaing:
    image: ghcr.io/enixcode/parpaing:2.0.0
    build: .
    container_name: parpaing
    restart: unless-stopped
    # ports: 
    #   - "${PARPAING_ADDRESS:-127.0.0.1}:8090:8090"
    environment:
      # Optional: when set, every API call needs Authorization: Bearer <key>.
      - PARPAING_API_KEY
      # The address the gateway publishes the port on: anything but 127.0.0.1, localhost or ::1 needs PARPAING_API_KEY, or parpaing stops.
      - PARPAING_ADDRESS
      # Optional: the engine of a sandbox that asks for none (runc). runsc (gVisor) once installed in Docker, see README.
      - PARPAING_RUNTIME
      # Optional: default ceilings per sandbox (memory and disk in MB): 1024, 1, 1024, 10240.
      - PARPAING_MEMORY
      - PARPAING_CPUS
      - PARPAING_PROCESSES
      - PARPAING_DISK
      # Optional: free memory kept for the machine, in MB (512): under it, no new sandbox.
      - PARPAING_RESERVED_MEMORY
      # Optional: the address range cut into one small network per sandbox (10.89.0.0/16, 4096 sandboxes).
      - PARPAING_SUBNETS
      # Optional: more addresses the egress proxy refuses, comma-separated CIDRs (the host's own addresses are refused already).
      - PARPAING_BLOCK
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      # The sandbox daemon: parpaing copies its binary here at start, every sandbox mounts this volume read-only.
      - "parpaing-daemon:/daemon"

  # The egress proxy (GOST): the only way out for sandboxes, each alone in an internal network. Its kernel refuses private
  # destinations; NET_ADMIN lets it set those rules in its own network namespace, not on the host.
  egress:
    build:
      context: .
      dockerfile: egress/Dockerfile
    image: ghcr.io/enixcode/parpaing-egress:2.0.0
    container_name: parpaing-egress
    restart: unless-stopped
    cap_add:
      - NET_ADMIN

  # The gateway, the only port: nginx serves the web page and the brand kit, and relays everything else to the API.
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: ghcr.io/enixcode/parpaing-gateway:2.0.0
    container_name: parpaing-gateway
    restart: unless-stopped
    depends_on:
      - parpaing
    environment:
      # Optional: the host names it answers to besides localhost and 127.0.0.1, space-separated (a domain or an IP in front).
      - PARPAING_HOSTS=${PARPAING_HOSTS:-}
    ports:
      - "${PARPAING_ADDRESS:-127.0.0.1}:8090:80"

volumes:
  # A fixed name, whatever this compose file's folder: sandboxes mount it by this name.
  parpaing-daemon:
    name: parpaing-daemon
