    26% { transform: translate(15.06px, -1.23px) rotate(3.22deg); }
    27% { transform: translate(16.10px, -1.80px) rotate(4.81deg); }
    28% { transform: translate(17.34px, -2.43px) rotate(6.68deg); }
    29% { transform: translate(18.79px, -3.10px) rotate(8.81deg); }
    30% { transform: translate(20.44px, -3.78px) rotate(11.21deg); }
    31% { transform: translate(22.29px, -4.46px) rotate(13.85deg); }
    32% { transform: translate(24.35px, -5.10px) rotate(16.75deg); }
    33% { transform: translate(26.61px, -5.68px) rotate(19.88deg); }
    34% { transform: translate(29.08px, -6.16px) rotate(23.25deg); }
    35% { transform: translate(31.74px, -6.51px) rotate(26.86deg); }
    36% { transform: translate(34.59px, -6.70px) rotate(30.69deg); }
    37% { transform: translate(37.62px, -6.69px) rotate(34.75deg); }
    38% { transform: translate(40.80px, -6.45px) rotate(39.03deg); }
    39% { transform: translate(44.14px, -5.70px) rotate(43.53deg); }
    40% { transform: translate(47.61px, -3.95px) rotate(48.24deg); }
    41% { transform: translate(51.07px, -1.40px) rotate(53.18deg); }
    42% { transform: translate(54.46px, 1.72px) rotate(58.32deg); }
    43% { transform: translate(57.78px, 5.10px) rotate(63.67deg); }
    44% { transform: translate(61.07px, 8.42px) rotate(69.23deg); }
    45% { transform: translate(64.37px, 11.40px) rotate(75.00deg); animation-timing-function: ease-out; }
    50% { transform: translate(69.85px, 12.84px) rotate(80.00deg); animation-timing-function: ease-in; }
    55%, 100% { transform: translate(64.37px, 11.40px) rotate(75.00deg); }
  }
@keyframes aglo-error-gasp { 0% { transform: scale(1); } 18% { transform: scale(1.25); } 45%, 100% { transform: scale(1); } }
@keyframes aglo-error-eo-hit { 0% { opacity: 1; } 45%, 100% { opacity: 0; } }
@keyframes aglo-error-ea-hit { 0% { opacity: 0; } 45%, 100% { opacity: 1; } }
@keyframes aglo-error-puff-l { 0%, 44% { opacity: 0; transform: translate(0, 0) scale(0.4); } 48% { opacity: 0.9; transform: translate(-2px, 0) scale(0.8); } 74%, 100% { opacity: 0; transform: translate(-15px, -6px) scale(1.5); } }
@keyframes aglo-error-puff-r { 0%, 44% { opacity: 0; transform: translate(0, 0) scale(0.4); } 48% { opacity: 0.9; transform: translate(2px, 0) scale(0.8); } 74%, 100% { opacity: 0; transform: translate(15px, -6px) scale(1.5); } }
.aglo-error-rock { transform-origin: 129px 83px; animation: aglo-error-rock 3.6s linear 3.4s infinite; }
.aglo-error-wig { animation: aglo-error-wig 3.6s ease-in-out 3.4s infinite; }
@keyframes aglo-error-rock {
    0%, 30% { transform: rotate(0.00deg); animation-timing-function: ease-in-out; }
    32% { transform: rotate(0.80deg); animation-timing-function: ease-in-out; }
    34% { transform: rotate(0.00deg); animation-timing-function: ease-in-out; }
    36% { transform: rotate(1.00deg); animation-timing-function: ease-in-out; }
    38% { transform: rotate(0.00deg); animation-timing-function: ease-out; }
    50% { transform: rotate(12.00deg); animation-timing-function: ease-in-out; }
    55% { transform: rotate(11.00deg); animation-timing-function: ease-in; }
    62% { transform: rotate(0.00deg); animation-timing-function: ease-out; }
    67% { transform: rotate(5.00deg); animation-timing-function: ease-in; }
    72% { transform: rotate(0.00deg); animation-timing-function: ease-out; }
    76% { transform: rotate(2.20deg); animation-timing-function: ease-in; }
    80% { transform: rotate(0.00deg); animation-timing-function: ease-out; }
    83% { transform: rotate(0.80deg); animation-timing-function: ease-in; }
    86%, 100% { transform: rotate(0.00deg); }
  }
@keyframes aglo-error-wig { 0%, 30%, 38%, 62%, 80%, 100% { transform: rotate(0deg); } 32% { transform: rotate(-10deg); } 34% { transform: rotate(10deg); } 36% { transform: rotate(-10deg); } 65% { transform: rotate(18deg); } 69% { transform: rotate(-12deg); } 74% { transform: rotate(6deg); } }
