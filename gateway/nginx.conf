# parpaing gateway, the only port: nginx serves the page and the brand kit, and relays everything else to the API.
server {
  listen 80;
  charset utf-8;
  server_tokens off;

  # Security headers, on the page and on the API answers. The page loads only its own files and Google Fonts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = / {
    root /srv/page;
    try_files /index.html =404;
  }

  location = /app.js {
    root /srv/page;
  }

  # The brand kit (docs/brand): logo, favicon, Aglo. One source, nothing copied into the page.
  location /brand/ {
    alias /srv/brand/;
  }

  # Everything else is the API, relayed as is. No buffering, so command output stays live.
  location / {
    proxy_pass http://parpaing:8090;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
