<svg xmlns="http://www.w3.org/2000/svg" width="288" height="196" viewBox="18 36 144 98" role="img" aria-label="Aglo, the parpaing mascot, floating gently and blinking now and then"><style>.aglo-idle-lift { animation: aglo-idle-lift 2s ease-in-out infinite alternate; } .aglo-idle-sway { transform-origin: 102px 68px; animation: aglo-idle-sway 3s ease-in-out infinite alternate; } @keyframes aglo-idle-lift { from { transform: translateY(0); } to { transform: translateY(-4px); } } @keyframes aglo-idle-sway { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } } .aglo-idle-eyes { transform-origin: 102px 68px; animation: aglo-idle-blink 5s ease-in-out infinite; } @keyframes aglo-idle-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.12); } } @media (prefers-reduced-motion: reduce) { .aglo-idle-eyes, .aglo-idle-lift, .aglo-idle-sway { animation: none !important; } }</style><path d="M22 129H158" stroke="#333a4a" stroke-width="1.5"/><g><g><rect x="48" y="92" width="60" height="36" rx="3" fill="#6e7891"/><rect x="60" y="104" width="12" height="12" fill="#121419"/><rect x="84" y="104" width="12" height="12" fill="#121419"/></g><g class="aglo-idle-lift"><g class="aglo-idle-sway"><rect x="72" y="50" width="60" height="36" rx="3" fill="#5cc2ff"/><g class="aglo-idle-eyes"><circle cx="90" cy="68" r="6.45" fill="#121419"/><circle cx="114" cy="68" r="6.45" fill="#121419"/></g></g></g></g></svg>
