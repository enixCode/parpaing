<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>parpaing API reference</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
</head>
<body>
<!-- Scalar draws /openapi.json. It reads its settings from this tag, so the page needs no inline script and the CSP stays strict.
     Nothing leaves the machine: no Scalar fonts, AI agent, telemetry, developer toolbar or link to Scalar's online client. -->
<script id="api-reference" data-url="/openapi.json" data-configuration='{"withDefaultFonts":false,"agent":{"disabled":true},"telemetry":false,"showDeveloperTools":"never","hideClientButton":true}'></script>
<script src="/docs/scalar.js"></script>
</body>
</html>
